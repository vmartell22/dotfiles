enabled_layouts tall:bias=50;full_size=1;mirrored=false

# BEGIN_KITTY_FONTS
font_family      family='BlexMono Nerd Font Mono' style=SemiBold
bold_font        family='BlexMono Nerd Font Mono' style=Bold
italic_font      family='BlexMono Nerd Font Mono' style='Medium Italic'
bold_italic_font family='BlexMono Nerd Font Mono' style='Bold Italic'
# END_KITTY_FONTS
#
font_size        11
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         round
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

window_border_width         2.5pt
window_margin_width         2.5
single_window_margin_width  -2
window_padding_width        2.5
initial_window_width        150c
initial_window_height       35c
remember_window_size        no

# linux_display_server x11
enable_audio_bell no
scrollback_lines -1
scrollback_pager_history_size 0
shell /usr/bin/bash --login
startup_session ~/.work-local-kitty-session
shell_integration enabled

# it's like BYOBU, but different
# navigation
map ctrl+shift+right      next_window
map ctrl+shift+left       previous_window
map ctrl+shift+page_up    next_tab
map ctrl+shift+page_down  previous_tab
# session management
map ctrl+shift+t    combine : new_tab : set_window_title " " : set_tab_title " "
map ctrl+shift+n    combine : new_os_window : set_window_title " "
# map ctrl+shift+c    combine : new_tab : set_tab_title " "
map ctrl+shift+f2   combine : new_window : set_window_title " "
map ctrl+shift+f8   set_window_title " "
map ctrl+shift+f9   set_tab_title " "
map ctrl+shift+s    select_tab

# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME


