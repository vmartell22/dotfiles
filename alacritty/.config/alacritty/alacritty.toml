general.import = [
  # uncomment the flavour you want below:
  # "~/.config/alacritty/catppuccin-latte.toml"
  # "~/.config/alacritty/catppuccin-frappe.toml"
  # "~/.config/alacritty/catppuccin-macchiato.toml"
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[font]
normal = { family = "BlexMono Nerd Font Mono SemiBold" }
bold = { family = "BlexMono Nerd Font Mono Bold" }
italic = { family = "BlexMono Nerd Font Mono SemiBold Italic" }
size = 13.0


[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]

[terminal]
#shell = { program = "fish", args = ["--login"] }

[env]
TERM = "xterm-256color"

[window.dimensions]
columns = 120
lines = 32

[window]
decorations = "full"
