add_newline = true
command_timeout = 200
format = '[\[](bold fg:blue)$os[\]](bold fg:blue)[\[](bold fg:blue)$env_var[\]](bold fg:blue)[\[](bold fg:blue)$username[\]](bold fg:blue)$directory$git_branch$git_status$character'
palette = "catppuccin_mocha"

[username]
style_user = "bold fg:rosewater"
style_root = "bold red"
format = '[$user]($style)'
show_always = true

[env_var.STARSHIP_SHELL]
variable = "STARSHIP_SHELL"
style = "pink"
format = '[$env_value]($style)'
disabled = false

[os]
disabled = false
style = "bold fg:rosewater"
format = "[$symbol]($style)"

[character]
success_symbol = " [❯](bold fg:green)"
error_symbol = " [✗](bold fg:red) [❯](bold fg:green)"
vimcmd_symbol = "[❮](fg:mauve)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "peach"
read_only_style = "red"
style = "bold mauve"
repo_root_format = '[\[](bold fg:blue)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[\]](bold fg:blue)'
format = '[\[](bold fg:blue)[$path]($style)[$read_only](bold $read_only_style)[\]](bold fg:blue)'
home_symbol = '󰋜 ~'
read_only = ' 󰌾'

[git_branch]
format = '[\[](bold fg:blue)[$symbol$branch]($style)[\]](bold fg:blue)'
style = "bold italic teal"
symbol = " "

[git_status]
format = '([\[](bold fg:blue)[$all_status$ahead_behind]($style)[\]](bold fg:blue))'
style = "bold fg:flamingo"
ahead      = "⇡${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
behind     = "⇣${count}"
conflicted = " "
up_to_date = " "
untracked  = " ?"
modified   = ""
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""


[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
